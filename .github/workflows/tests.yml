name: Tests and server package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests -q
      - run: bash -n deploy/server/install.sh
      - run: python scripts/build_server_release.py
  server-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-venv python3-pip
      - run: sudo bash deploy/server/install.sh
      - name: Verify services and upgrade preserves credentials
        run: |
          curl -fsS http://127.0.0.1:8765/healthz
          systemctl is-active paperflow-web paperflow-worker
          sudo sha256sum /etc/paperflow-web.env > /tmp/env-before
          sudo bash deploy/server/install.sh --upgrade
          sudo sha256sum -c /tmp/env-before
          curl -fsS http://127.0.0.1:8765/healthz
      - name: Service logs on failure
        if: failure()
        run: sudo journalctl -u paperflow-web -u paperflow-worker -n 80 --no-pager
