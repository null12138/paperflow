[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperflow"
version = "0.6.0"
description = "物种文献多源检索 + PDF 批量下载（WOS/PubMed/Crossref/S2/CNKI/Sci-Hub/OA/出版社订阅）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "playwright>=1.40",
    "pycryptodome>=3.20,<4",
    "playwright-stealth>=2.0,<3",
    "selenium>=4.20,<5",
    "pypdf>=5.0,<7",
    "tqdm>=4.66,<5",
    "urllib3>=1.26,<3",
    "textual>=0.89,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
paperflow = "paperflow.cli:main"

[tool.setuptools.packages.find]
include = ["paperflow*"]

[tool.setuptools.package-data]
paperflow = ["pdf/learned_patterns.json"]
